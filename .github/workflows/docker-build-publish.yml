name: "Create and publish container images"

on:
  push:
    branches:
      - "release/sirosid"
      - "feature/github_build"
    tags:
      - "v*.*.**"
      - "v*.*.**-sirosid.*"

env:
  REGISTRY: "ghcr.io"
  NAME: "${{ github.repository }}"

jobs:
  "build-and-push-image":
    runs-on: "ubuntu-24.04"
    permissions:
      contents: "read"
      packages: "write"

    steps:
      # GHCR doesn't accept uppercase characters in repository path \_o_/
      - name: "Extract lowercase name"
        id: "lowercaser"
        run: "echo \"name=${NAME}\" | tr '[[:upper:]]' '[[:lower:]]' >> \"${GITHUB_OUTPUT}\""

      - name: "Checkout repository"
        uses: "actions/checkout@v4"

      - name: "Setup Buildx for Docker"
        uses: "docker/setup-buildx-action@ba31df4664624f17e1b1ef1c9c85ed1ca9463a6d"

      - name: "Log in to the Container registry"
        uses: "docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build and push docker images"
        run: |
          export DOCKER_REGISTRY="${{ env.REGISTRY }}/${{ steps.lowercaser.outputs.name }}"
          make docker-build
          make docker-push
